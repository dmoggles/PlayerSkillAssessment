[project]
name = "player-skill-assessment"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "sqlalchemy>=2.1.3",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.15.0",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
