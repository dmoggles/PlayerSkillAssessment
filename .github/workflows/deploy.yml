name: Deploy to Production

on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: assessment_test
          POSTGRES_USER: assessment
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U assessment -d assessment_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configurations
        run: |
          docker compose -f compose.yaml -f compose.local.yaml --profile local config -q
          docker compose --env-file deploy/development.env.example -f compose.yaml -f compose.dev.yaml --profile local config -q
          docker compose --env-file deploy/production.env.example -f compose.yaml -f compose.prod.yaml config -q
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - name: Backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://assessment:test-only@localhost:5432/assessment_test
          PUBLIC_BASE_URL: http://testserver
          SMTP_HOST: localhost
        run: |
          uv sync --frozen --extra test
          uv run alembic upgrade head
          uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            context: backend
            image: ghcr.io/dmoggles/playerskillassessment-api
          - service: web
            context: frontend
            image: ghcr.io/dmoggles/playerskillassessment-web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: APP_VERSION=${{ github.event.release.tag_name }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.event.release.tag_name }}
            ${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}-prod
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-prod

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment settings
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          for name in SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY DEPLOY_PATH; do
            if [ -z "${!name}" ]; then echo "::error::$name is not configured for production"; exit 1; fi
          done
      - name: Copy Compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          source: compose.yaml,compose.prod.yaml,deploy/init-app-user.sh,deploy/backup.sh,deploy/restore.sh,deploy/setup_backups.sh,deploy/backup.env.example,deploy/harden_host.sh
          target: ${{ secrets.DEPLOY_PATH }}
      - name: Pull, migrate, restart
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          command_timeout: 20m
          envs: DEPLOY_PATH,RELEASE_TAG
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            test -f .env.prod
            export API_IMAGE="ghcr.io/dmoggles/playerskillassessment-api:$RELEASE_TAG"
            export WEB_IMAGE="ghcr.io/dmoggles/playerskillassessment-web:$RELEASE_TAG"
            docker compose --env-file .env.prod -f compose.yaml -f compose.prod.yaml pull api web
            docker compose --env-file .env.prod -f compose.yaml -f compose.prod.yaml up -d db
            # Back up before migrations touch the data; no backup, no deploy.
            if [ ! -f .backup.env ]; then echo "::error::.backup.env is missing in $DEPLOY_PATH: set up backups (README) before deploying"; exit 1; fi
            RELEASE_TAG="$RELEASE_TAG" bash deploy/backup.sh pre-deploy
            docker compose --env-file .env.prod -f compose.yaml -f compose.prod.yaml run --rm migrate
            docker compose --env-file .env.prod -f compose.yaml -f compose.prod.yaml up -d --no-build api web
            curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors http://127.0.0.1:8082/api/health
